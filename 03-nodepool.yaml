# EKS Auto Mode NodePool dedicated to queue workers.
# Wide instance diversity = Spot capacity is almost always available.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: pubsub-workers
spec:
  weight: 50
  template:
    metadata:
      labels:
        workload: pubsub-worker
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: default
      taints:
        - key: workload
          value: pubsub-worker
          effect: NoSchedule
      expireAfter: 336h
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]        # falls back to on-demand if Spot is short
        - key: eks.amazonaws.com/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: eks.amazonaws.com/instance-generation
          operator: Gt
          values: ["5"]
        - key: eks.amazonaws.com/instance-cpu
          operator: In
          values: ["2", "4", "8", "16"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ap-south-1a", "ap-south-1b", "ap-south-1c"]   # change to your region's AZs
  limits:
    cpu: "400"                                 # hard cost ceiling
    memory: 1600Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m
    budgets:
      - nodes: "10%"                           # never disrupt >10% of nodes at once
