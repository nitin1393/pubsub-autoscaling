# vpa-gate controller: lets VPA resize running pods only after HPA has settled.
#
#   HPA scaled in the last 15 min, or still scaling -> VPA updateMode = Initial
#   HPA stable for 15 min                           -> VPA updateMode = InPlaceOrRecreate
#
# It watches HPAs, so it switches to Initial within seconds of scaling, and
# re-checks exactly when the 15-minute window ends. Source: controller/
# Which VPAs it manages is set by annotations on each VPA (see 06-vpa.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vpa-gate
  namespace: my-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vpa-gate
  namespace: my-app
rules:
  - apiGroups: ["autoscaling.k8s.io"]
    resources: ["verticalpodautoscalers"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]          # leader election
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vpa-gate
  namespace: my-app
subjects:
  - kind: ServiceAccount
    name: vpa-gate
    namespace: my-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vpa-gate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpa-gate
  namespace: my-app
  labels:
    app: vpa-gate
spec:
  replicas: 1                     # leader election makes 2 safe if you want HA
  selector:
    matchLabels:
      app: vpa-gate
  template:
    metadata:
      labels:
        app: vpa-gate
      annotations:                # groundcover scrapes these metrics
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: vpa-gate
      # GHCR packages from a private repo are private: either make the
      # vpa-gate package public, or create this pull secret (see README).
      # imagePullSecrets:
      #   - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vpa-gate
          image: ghcr.io/nitin1393/vpa-gate:0.1.0
          args:
            - --watch-namespace=my-app
            - --stable-window=15m
            - --scaling-mode=Initial
            - --settled-mode=InPlaceOrRecreate
            - --leader-elect=true
            - --dry-run=false
          ports:
            - { name: metrics, containerPort: 8080 }
            - { name: probes, containerPort: 8081 }
          livenessProbe:
            httpGet: { path: /healthz, port: probes }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: probes }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
