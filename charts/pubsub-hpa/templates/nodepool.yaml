{{- if .Values.nodePool.enabled }}
{{- $np := .Values.nodePool }}
{{- $auto := eq $np.provisioner "autoMode" }}
{{- /* Auto Mode and self-managed Karpenter share the NodePool API; only the
       node class and the instance label prefix differ. */}}
{{- $prefix := ternary "eks.amazonaws.com" "karpenter.k8s.aws" $auto }}
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ $np.name }}
  labels:
    {{- include "pubsub-hpa.labels" . | nindent 4 }}
  annotations:
    pubsub-autoscaling/provisioner: {{ $np.provisioner }}
spec:
  template:
    metadata:
      labels:
        workload: pubsub-worker
    spec:
      nodeClassRef:
        {{- if $auto }}
        group: eks.amazonaws.com
        kind: NodeClass
        name: default
        {{- else }}
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: {{ $np.karpenter.nodeClassName }}
        {{- end }}
      {{- if $np.taint }}
      taints:
        - key: workload
          value: pubsub-worker
          effect: NoSchedule
      {{- end }}
      expireAfter: {{ $np.expireAfter }}
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: {{ toJson $np.capacityTypes }}
        - key: {{ $prefix }}/instance-category
          operator: In
          values: {{ toJson $np.instanceCategories }}
        - key: {{ $prefix }}/instance-generation
          operator: Gt
          values: [{{ $np.instanceGenerationGreaterThan | quote }}]
        - key: {{ $prefix }}/instance-cpu
          operator: In
          values: {{ toJson $np.instanceCpu }}
        {{- with $np.zones }}
        - key: topology.kubernetes.io/zone
          operator: In
          values: {{ toJson . }}
        {{- end }}
  limits:
    cpu: {{ $np.limits.cpu | quote }}
    memory: {{ $np.limits.memory }}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: {{ $np.consolidateAfter }}
    budgets:
      - nodes: {{ $np.disruptionBudget | quote }}
{{- end }}
