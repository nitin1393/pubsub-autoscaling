{{- $np := .Values.nodePool }}
{{- if and $np.enabled (eq $np.provisioner "karpenter") $np.karpenter.createEC2NodeClass }}
{{- $nc := $np.karpenter.ec2NodeClass }}
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: {{ $np.karpenter.nodeClassName }}
  labels:
    {{- include "pubsub-hpa.labels" . | nindent 4 }}
spec:
  role: {{ $nc.role | quote }}
  amiSelectorTerms:
    - alias: {{ $nc.amiAlias | quote }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ $nc.discoveryTag | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ $nc.discoveryTag | quote }}
  metadataOptions:
    httpTokens: {{ $nc.metadataHttpTokens }}
    httpPutResponseHopLimit: 1
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: {{ $nc.blockDevice.size }}
        volumeType: {{ $nc.blockDevice.type }}
        encrypted: {{ $nc.blockDevice.encrypted }}
        deleteOnTermination: true
{{- end }}
