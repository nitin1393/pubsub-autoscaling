apiVersion: v1
kind: Service
metadata:
  name: {{ include "vpa-gate.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vpa-gate.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "vpa-gate.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
{{- if .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "vpa-gate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vpa-gate.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "vpa-gate.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
