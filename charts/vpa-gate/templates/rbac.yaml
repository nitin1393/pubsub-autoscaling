{{- $fullname := include "vpa-gate.fullname" . -}}
{{- $watchNS := include "vpa-gate.watchNamespace" . -}}
{{- $rules := list
  (dict "apiGroups" (list "autoscaling.k8s.io") "resources" (list "verticalpodautoscalers") "verbs" (list "get" "list" "watch" "patch"))
  (dict "apiGroups" (list "autoscaling") "resources" (list "horizontalpodautoscalers") "verbs" (list "get" "list" "watch"))
  (dict "apiGroups" (list "") "resources" (list "events") "verbs" (list "create" "patch"))
-}}
{{- if .Values.watchAllNamespaces }}
# Watch every namespace: cluster-wide read of VPAs/HPAs, patch of VPAs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "vpa-gate.labels" . | nindent 4 }}
rules:
  {{- toYaml $rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "vpa-gate.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "vpa-gate.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}
{{- else }}
# Watch one namespace: least privilege.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}
  namespace: {{ $watchNS }}
  labels:
    {{- include "vpa-gate.labels" . | nindent 4 }}
rules:
  {{- toYaml $rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}
  namespace: {{ $watchNS }}
  labels:
    {{- include "vpa-gate.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "vpa-gate.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}
{{- end }}
{{- if .Values.leaderElection.enabled }}
---
# Leader election lease, always in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vpa-gate.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vpa-gate.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "vpa-gate.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-leader-election
{{- end }}
