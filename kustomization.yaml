apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# What Argo CD deploys from this repo (the vpa-gate controller is a separate
# Argo CD app from charts/vpa-gate). The groundcover API key Secret is NOT
# here on purpose: create it in the cluster (see README) so no key is in Git.
resources:
  - 01-keda-auth.yaml
  - 02-scaledobject.yaml
  - 03-nodepool.yaml
  - 04-overprovisioning.yaml
  - 05-worker-deployment.yaml
  - 06-vpa.yaml
