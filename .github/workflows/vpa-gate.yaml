name: vpa-gate

on:
  push:
    branches: [main]
    paths: ["controller/**", "charts/**", "loadtest/**", ".github/workflows/vpa-gate.yaml"]
    tags: ["vpa-gate-v*"]
  pull_request:
    paths: ["controller/**", "charts/**", "loadtest/**", ".github/workflows/vpa-gate.yaml"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vpa-gate
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: unit tests + 3 simulated traffic days (race detector)
        run: go test ./... -race -short -count=1

  stress:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum
      - name: 20 simulated 8-hour traffic days, flapping, 200 parallel VPAs
        run: go test ./internal/controller -run TestStress -count=1 -v | grep -E "^(=== RUN|--- |ok|FAIL)|switches"
      - name: fuzz the decision logic
        run: go test ./internal/gate -run '^$' -fuzz FuzzDecide -fuzztime 60s
      - name: benchmarks (smoke)
        run: go test ./internal/controller -run '^$' -bench . -benchmem -benchtime 200x

  loadtest-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q loadtest

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint charts/vpa-gate --strict
      - name: helm template (default, own namespace + ServiceMonitor, all namespaces)
        run: |
          helm template t charts/vpa-gate -n my-app > /dev/null
          helm template t charts/vpa-gate -n vpa-gate --set watchNamespace=my-app \
            --set metrics.serviceMonitor.enabled=true > /dev/null
          helm template t charts/vpa-gate -n vpa-gate --set watchAllNamespaces=true > /dev/null

  image:
    needs: [test, stress]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=vpa-gate-v(.*),group=1
      - uses: docker/build-push-action@v6
        with:
          context: controller
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart-publish:
    needs: chart
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Push chart to GHCR (version from Chart.yaml)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/vpa-gate -d /tmp/chart
          helm push /tmp/chart/vpa-gate-*.tgz "$CHART_REPO"
