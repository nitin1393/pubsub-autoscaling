# KEDA authentication for groundcover's Prometheus API.
#
# The Secret it reads (groundcover-api-key) is deliberately NOT in Git.
# Create it once in the cluster (or via External Secrets / Sealed Secrets):
#   kubectl -n my-app create secret generic groundcover-api-key \
#     --from-literal=bearerToken=<YOUR_GROUNDCOVER_API_KEY>
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: groundcover-auth
  namespace: my-app
spec:
  secretTargetRef:
    - parameter: bearerToken
      name: groundcover-api-key
      key: bearerToken
